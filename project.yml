name: CLDiagnostic

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  CLDiagnostic:
    type: application
    platform: iOS
    sources:
      - CLDiagnostic.swift

    info:
      path: Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borja.CLDiagnostic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
