name: Build CLDiagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Create project
        run: |
          cat > project.yml <<'EOF'
          name: CLDiagnostic

          options:
            deploymentTarget:
              iOS: "17.0"

          targets:
            CLDiagnostic:
              type: application
              platform: iOS
              sources:
                - CLDiagnostic.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.borja.CLDiagnostic
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  INFOPLIST_FILE: Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify project
        run: |
          grep -R "INFOPLIST_FILE" CLDiagnostic.xcodeproj/project.pbxproj
          test -f Info.plist

      - name: Build
        run: |
          xcodebuild \
            -project CLDiagnostic.xcodeproj \
            -scheme CLDiagnostic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CLDiagnostic.app Payload/CLDiagnostic.app
          zip -r CLDiagnostic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CLDiagnostic-IPA
          path: CLDiagnostic.ipa
