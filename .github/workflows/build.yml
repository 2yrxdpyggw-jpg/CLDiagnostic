name: Build CLDiagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project CLDiagnostic.xcodeproj \
            -scheme CLDiagnostic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CLDiagnostic.app Payload/
          zip -r CLDiagnostic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CLDiagnostic-IPA
          path: CLDiagnostic.ipa
