name: CLDiagnostic

options:
  bundleIdPrefix: com.borja
  deploymentTarget:
    iOS: "17.0"

targets:
  CLDiagnostic:
    type: application
    platform: iOS
    sources:
      - CLDiagnostic.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borja.CLDiagnostic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSlocationWhenInUseUsageDescription: "Esta aplicación necesita tu ubicación para diagnosticar Core Location."
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
